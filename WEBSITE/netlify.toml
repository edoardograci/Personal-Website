[build]
  publish = "WEBSITE/dist"
  functions = "WEBSITE/netlify/functions"

# Proxy all non-static requests to the function (clean URLs)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/rewrite-html"
  status = 200
  force = true
  conditions = {
    Path = [
      "!/assets/*",
      "!/favicon.ico",
      "!/sitemap.xml",
      "!/robots.txt",
      "!/site.webmanifest",
      "!/verification/*"
    ]
  }

# Serve static assets
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# 404 handling
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

# Headers (consolidated)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
