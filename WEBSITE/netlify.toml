[build]
  publish = "WEBSITE/dist"

# Set up a subdomain proxy
[[redirects]]
  from = "https://proxy.edoardograci.com/*"
  to = "/.netlify/functions/framer-proxy/:splat"
  status = 200
  force = true

# Main domain redirects to proxy
[[redirects]]
  from = "https://edoardograci.com/*"
  to = "https://proxy.edoardograci.com/:splat"
  status = 200
  force = true

# Keep asset redirects
[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true
