# Specify the publish directory for static files
[build]
  publish = "WEBSITE/dist"

# Primary edge function route
[[edge_functions]]
  path = "/*"
  function = "framer-proxy"

# Redirect assets directly from Framer
[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true

# Allow direct access to static files (CSS, JS, images)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# Return 404 for direct access to the proxy function
[[redirects]]
  from = "/.netlify/functions/framer-proxy"
  to = "/404.html"
  status = 404
  force = true

