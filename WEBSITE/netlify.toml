# Specify the publish directory for static files
[build]
  publish = "WEBSITE/dist"
  functions = "netlify/functions" # Where your functions are located

# Redirect assets directly from Framer
[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true

# Route all other requests through the proxy
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/framer-proxy/:splat"
  status = 200
  force = false
