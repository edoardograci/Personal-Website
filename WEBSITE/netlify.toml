[build]
  publish = "WEBSITE/dist"

# Primary edge function route
[[edge_functions]]
  path = "/*"
  function = "framer-proxy"

# Redirect assets directly from Framer
[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true

# Allow direct access to static files (CSS, JS, images)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# Catch-all redirect to the edge function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/framer-proxy"
  status = 200
  force = true

# Add security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
