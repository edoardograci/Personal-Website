[build]
  publish = "WEBSITE/dist"
  
# Redirect assets directly from Framer
[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true

# Allow direct access to static files (CSS, JS, images)
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

# Route everything else through the proxy (EXCLUDING STATIC FILES)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/framer-proxy"
  status = 200
  force = true

# Edge function to handle proxying
[[edge_functions]]
  path = "/*"  # Edge function handles all paths after redirects
  function = "framer-proxy"
