[build]
  publish = "WEBSITE/dist"

# Edge function routing
[[edge_functions]]
  path = "/*"
  function = "framer-proxy"
  # Add explicit priority
  [edge_functions]
    for = "/*"

# Critical redirect fix
[[redirects]]
  from = "/*"
  to = "/.netlify/edge-functions/framer-proxy/:splat"
  status = 200
  force = true
  # Add query parameter preservation
  query = { ":splat" = ":splat" }

# Static assets handling
[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true
  conditions = { Edge = "framer-proxy" }

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=3600"
    # Add critical proxy header
    Vary = "Accept-Encoding"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
