[build]
  publish = "WEBSITE/dist"

[[edge_functions]]
  path = "/*"
  function = "framer-proxy"

[[redirects]]
  from = "/assets/*"
  to = "https://charismatic-everyone-653587.framer.app/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/edge-functions/framer-proxy"
  status = 200
  force = false
