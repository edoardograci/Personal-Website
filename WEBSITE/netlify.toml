[build]
  publish = "WEBSITE/dist"
  functions = "WEBSITE/netlify/functions"

# Rewrite ALL requests to the function (invisibly)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/rewrite-html"
  status = 200
  force = true
  conditions = {
    Path = [
      "!/assets/*",
      "!/.netlify/functions/*", # Prevent loops
      "!/favicon.ico",
      "!/sitemap.xml",
      "!/robots.txt",
      "!/site.webmanifest",
      "!/verification/*"
    ]
  }

# Serve static assets directly
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# Headers (unchanged)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/assets/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/x-icon"
